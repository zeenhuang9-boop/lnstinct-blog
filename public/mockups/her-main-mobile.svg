<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2060" viewBox="0 0 390 2060" font-family="'Songti SC','STSong','SimSun','Noto Serif CJK SC',Georgia,serif" lengthAdjust="spacingAndGlyphs">
  <rect width="390" height="2060" fill="#faf3e6"/>

  <!-- 标注：边距 16 -->
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#a8502f">
    <line x1="16" y1="8" x2="16" y2="2052" stroke="#a8502f" opacity="0.35" stroke-dasharray="3 4"/>
    <line x1="374" y1="8" x2="374" y2="2052" stroke="#a8502f" opacity="0.35" stroke-dasharray="3 4"/>
    <text x="195" y="14" text-anchor="middle">390 × 手机 · 边距 16</text>
  </g>

  <!-- ===== 页头 ===== -->
  <text x="16" y="66" font-size="20" font-weight="700" fill="#2b2620">lnstinct.</text>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
    <rect x="258" y="46" width="28" height="26" rx="3" fill="none" stroke="#e0d5be"/>
    <text x="272" y="63" text-anchor="middle" fill="#6f6353">夜</text>
    <rect x="294" y="46" width="28" height="26" rx="3" fill="none" stroke="#e0d5be"/>
    <circle cx="308" cy="56" r="4" fill="#a8502f"/>
    <text x="308" y="60" text-anchor="middle" font-size="7" fill="#faf3e6">日</text>
    <rect x="330" y="46" width="28" height="26" rx="3" fill="none" stroke="#e0d5be"/>
    <text x="344" y="64" text-anchor="middle" font-size="15" fill="#6f6353">☰</text>
  </g>
  <line x1="0" y1="94" x2="390" y2="94" stroke="#e0d5be"/>

  <!-- ===== 子导航 ===== -->
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
    <text x="16" y="140" fill="#2b2620" font-weight="700">我们</text>
    <text x="70" y="140" fill="#6f6353">照片墙</text>
    <text x="140" y="140" fill="#6f6353">信</text>
    <line x1="16" y1="156" x2="52" y2="156" stroke="#a8502f" stroke-width="2"/>
  </g>

  <!-- ===== Hero ===== -->
  <text x="16" y="216" font-size="32" font-weight="700" fill="#2b2620">写给 阿念</text>
  <text x="212" y="216" font-size="18" fill="#a8502f" opacity="0.75">·</text>
  <text x="240" y="216" font-size="14" fill="#6f6353" opacity="0.7">2026</text>
  <text x="16" y="248" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6f6353">一页只写给你看的地方：日子、照片，还有</text>
  <text x="16" y="272" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6f6353">一些一直没说完的话。</text>

  <!-- ===== 生日数字卡 ===== -->
  <rect x="16" y="312" width="358" height="300" rx="4" fill="#faf3e6" stroke="#e0d5be"/>
  <rect x="50" y="382" width="6" height="30" fill="#a8502f"/>
  <text x="72" y="406" font-size="54" font-weight="700" fill="#2b2620">364</text>
  <text x="172" y="406" font-size="14" fill="#6f6353">天</text>
  <text x="72" y="438" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">距离下一次生日 · 10 月 11 日</text>
  <text x="72" y="464" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a8502f">昨天刚过完，这次我记牢了。</text>
  <text x="72" y="490" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353" opacity="0.75">生日当天这张卡会换成「今天」。</text>
  <line x1="50" y1="522" x2="340" y2="522" stroke="#e0d5be"/>
  <rect x="50" y="550" width="6" height="30" fill="#a8502f" opacity="0.45"/>
  <text x="72" y="574" font-size="54" font-weight="700" fill="#2b2620" opacity="0.55">12</text>
  <text x="140" y="574" font-size="14" fill="#6f6353" opacity="0.55">天</text>
  <text x="72" y="596" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">站在这页上的时间 · 建页纪念日</text>

  <!-- ===== 大事记：事件带照片 ===== -->
  <text x="16" y="680" font-size="20" font-weight="700" fill="#2b2620">我们的大事记</text>
  <line x1="34" y1="716" x2="34" y2="1080" stroke="#e0d5be"/>

  <circle cx="34" cy="746" r="5" fill="#a8502f"/>
  <rect x="58" y="722" width="64" height="48" rx="2" fill="#e8d3c4" stroke="#e0d5be"/>
  <text x="90" y="750" text-anchor="middle" font-size="11" fill="#6f6353" opacity="0.7">照 1</text>
  <text x="134" y="738" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a8502f">2026 · 10 · 12</text>
  <text x="134" y="762" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#2b2620">做这一页的那天</text>
  <text x="58" y="796" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">照片挂在事件上，点了去照片墙看大图。</text>

  <circle cx="34" cy="906" r="5" fill="#e0d5be"/>
  <rect x="58" y="882" width="64" height="48" rx="2" fill="#f3e9d6" stroke="#e0d5be" stroke-dasharray="3 3"/>
  <text x="90" y="910" text-anchor="middle" font-size="11" fill="#6f6353" opacity="0.7">待补</text>
  <text x="134" y="898" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353">待填</text>
  <text x="134" y="922" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#2b2620">第一次见面</text>
  <text x="58" y="956" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">没有确切日期就先空着。</text>

  <circle cx="34" cy="1046" r="5" fill="#e0d5be"/>
  <rect x="58" y="1022" width="64" height="48" rx="2" fill="#f3e9d6" stroke="#e0d5be" stroke-dasharray="3 3"/>
  <text x="90" y="1050" text-anchor="middle" font-size="11" fill="#6f6353" opacity="0.7">待补</text>
  <text x="134" y="1038" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353">待填</text>
  <text x="134" y="1062" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#2b2620">在一起那天</text>
  <text x="58" y="1096" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">填了之后上面会多出「已走过 N 天」。</text>

  <!-- ===== 最近的照片：手机一列 ===== -->
  <text x="16" y="1176" font-size="20" font-weight="700" fill="#2b2620">最近的照片</text>
  <text x="374" y="1176" text-anchor="end" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a8502f">全部 12 张 →</text>
  <g stroke="#e0d5be">
    <rect x="16" y="1206" width="358" height="201" rx="3" fill="#f3e9d6"/>
    <rect x="16" y="1471" width="358" height="201" rx="3" fill="#e8d3c4"/>
  </g>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353" opacity="0.42" text-anchor="middle">
    <text x="195" y="1310">照片</text>
    <text x="195" y="1575">照片</text>
  </g>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a8502f">
    <text x="16" y="1428">10 · 12</text>
    <text x="16" y="1693">10 · 12</text>
  </g>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353">
    <text x="16" y="1452">做这一页的那天</text>
    <text x="16" y="1717">第一次见面</text>
  </g>

  <!-- ===== 去另两页的入口 ===== -->
  <line x1="16" y1="1740" x2="374" y2="1740" stroke="#e0d5be"/>
  <text x="16" y="1790" font-size="18" font-weight="700" fill="#2b2620">照片墙</text>
  <text x="16" y="1816" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">按时间分组的全部照片。</text>
  <text x="374" y="1806" text-anchor="end" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a8502f">照片墙 →</text>
  <text x="16" y="1874" font-size="18" font-weight="700" fill="#2b2620">写给你的信</text>
  <text x="16" y="1900" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6f6353">长文排版，独立一页。</text>
  <text x="374" y="1890" text-anchor="end" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a8502f">信 →</text>

  <!-- ===== 页脚 ===== -->
  <line x1="0" y1="1975" x2="390" y2="1975" stroke="#e0d5be"/>
  <text x="16" y="2017" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353">lnstinct. · 内容均为本人书写</text>
  <text x="16" y="2043" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6f6353">本页仅本机可见 · 未进主导航</text>
</svg>
